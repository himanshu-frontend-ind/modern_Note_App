<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Note App</title>
    <style>
        /* Basic Reset */
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', sans-serif;
            /* Modern font stack */
        }

        body {
            background-color: #fafafa;
            /* Very light gray for background */
            color: #1a1a1a;
        }

        .main {
            display: flex;
            flex-direction: row;
            min-height: 100vh;
        }

        /* Left Side: Form Sidebar */
        .left {
            width: 30vw;
            background-color: #1a1a1a;
            /* Deep Black Sidebar */
            padding: 40px 30px;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.05);
            position: sticky;
            top: 0;
            height: 100vh;
            color: #ffffff;
            /* White text for black background */
        }

        .left h2 {
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: -1px;
            font-size: 1.8rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* Inputs styling */
        input[type="text"],
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #333;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            background-color: #262626;
            /* Dark input fields */
            color: white;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #ffffff;
            background-color: #333;
        }

        textarea {
            height: 180px;
            resize: none;
        }

        /* Save Button */
        #addBtn {
            width: 100%;
            padding: 15px;
            background-color: #ffffff;
            /* Contrast white button */
            color: #1a1a1a;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        #addBtn:hover {
            background-color: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }

        /* Right Side: Notes Display */
        .right {
            width: 70vw;
            padding: 50px;
            overflow-y: auto;
            background-color: #898585;
        }

        .right h2 {
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 800;
            color: white;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        /* Note Card Style (The Masterpiece) */
        .card {
            background: url(https://peachprintable.com/resources/img/2025/11/notes-paper-1_232x300.jpg);
            background-size: cover;
            overflow: hidden;
            padding: 25px;
            border-radius: 16px;
            border: 1px solid #eaeaea;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 200px;
            max-height: 350px;
            /* Zyadatar card ki ek max height fix kar dein */
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
            border-color: #1a1a1a;
        }

        .card h3 {
            margin-bottom: 12px;
            font-size: 1.3rem;
            font-weight: 700;
            color: black;
        }

        .card p {
            font-size: 1rem;
            color: black;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            overflow-y: auto;
            /* Agar text bahut zyada ho toh card ke andar hi chhota scrollbar aa jaye */
            max-height: 180px;
            /* Paragraph ki height limit karega taaki card na khinche */
        }

        /* Button Group inside cards */
        .btn-group {
            display: flex;
            margin-top: 20px;
            gap: 12px;
        }

        .edit-btn,
        .delete-btn {
            padding: 10px 15px;
            font-size: 0.85rem;
            border-radius: 8px;
            flex: 1;
            font-weight: 600;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .edit-btn {
            background-color: #1a1a1a;
            color: #fff;
        }

        .edit-btn:hover {
            background-color: #f0f0f0;
            color: #1a1a1a;
        }

        .delete-btn {
            background-color: transparent;
            color: #e74c3c;
            /* Thoda sa red for alert, otherwise light gray for monochrome */
            border: 1px solid #fee;
        }

        .delete-btn:hover {
            background-color: #e74c3c;
            color: #fff;
        }

        /* Scrollbar styling */
        body::-webkit-scrollbar {
            display: none;
        }

        /* --- Responsive Design --- */
        @media (max-width: 768px) {
            .main {
                flex-direction: column;
            }

            .left {
                width: 100%;
                height: auto;
                padding: 30px 20px;
                position: relative;
            }

            .right {
                width: 100%;
                height: auto;
                /* Fixed 540px ko hata kar auto kar dein */
                max-height: 60vh;
                /* Ek limit de dein taaki screen se bahar na jaye */
                overflow-y: auto;
            }

            .right::-webkit-scrollbar {
                display: none;
            }

            .container {
                grid-template-columns: 1fr;
                /* Single column notes on mobile */
            }
        }
    </style>
</head>

<body>

    <div class="main">
        <!-- Left Side: Input Section -->
        <div class="left">
            <h2>Add New Note</h2>
            <div class="form-group">
                <input type="text" id="noteTitle" placeholder="Note Title...">
            </div>
            <div class="form-group">
                <textarea id="noteContent" placeholder="Write your note here..."></textarea>
            </div>
            <button id="addBtn">Save Note</button>
        </div>

        <!-- Right Side: Display Section -->
        <div class="right">
            <h2>My Notes</h2>
            <div class="container" id="notesContainer">

                <!-- Example of a Card (Yeh JS se generate hoga) -->


            </div>
        </div>
    </div>
    <script>
        // 1. Pehle DOM elements ko select karein
        const addBtn = document.getElementById('addBtn');
        const titleInput = document.getElementById('noteTitle');
        const contentInput = document.getElementById('noteContent');
        const notesContainer = document.getElementById('notesContainer');

        // 2. SaveCards
        function saveChanges() {
            const notes = []
            document.querySelectorAll(".card").forEach(card => {
                notes.push({
                    title: card.querySelector("h3").innerText,
                    content: card.dataset.rawContent || card.querySelector("p").innerText
                })
            })
            localStorage.setItem("mynotes", JSON.stringify(notes))
        }

        // showCards
        function loadCards() {
            const savedCard = JSON.parse(localStorage.getItem('mynotes')) || [];
            savedCard.reverse().forEach(card => {
                createCardElements(card.title, card.content)
            })

        }

        // 3. Generate cards
        function createCardElements(title, content) {
            const card = document.createElement('div');
            card.classList.add('card');

            card.dataset.rawContent = content;

            // 2. Text Content (Title aur Paragraph)
            const textSection = document.createElement("div"); // Upar wala hissa

            const h3 = document.createElement('h3');
            h3.innerText = title.toUpperCase();

            const p = document.createElement('p');
            p.innerText = content;

            textSection.appendChild(h3);
            textSection.appendChild(p);

            // 3. Button Group (Niche wala hissa)
            const btnGroup = document.createElement("div");
            btnGroup.className = "btn-group";

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "delete-btn";
            deleteBtn.textContent = "Delete";
            // Delete functionality
            // deleteBtn.onclick = () => card.remove();

            const editBtn = document.createElement("button");
            editBtn.className = "edit-btn";
            editBtn.textContent = "Edit";
            // Edit functionality (Simple logic)
            // editBtn.onclick = () => {
            //     titleInput.value = h3.innerText;
            //     contentInput.value = p.innerText;
            //     card.remove();
            // };

            btnGroup.appendChild(editBtn);
            btnGroup.appendChild(deleteBtn);

            // 4. Sabko Card mein jodein
            card.appendChild(textSection);
            card.appendChild(btnGroup);

            // 5. Final Display
            notesContainer.appendChild(card);
        }

        // 4. Button click par function chalayein
        addBtn.addEventListener('click', () => {
            const titleValue = titleInput.value;
            const contentValue = contentInput.value;

            if (titleValue.trim() === "" || contentValue.trim() === "") {
                alert("Please enter both title and content!");
                return;
            }


            createCardElements(titleValue, contentValue)
            saveChanges()

            // 6. Inputs Clear
            titleInput.value = "";
            contentInput.value = "";
        });

        notesContainer.addEventListener("click", function (e) {
            if (e.target.matches(".delete-btn")) {
                let card = e.target.closest(".card")
                notesContainer.removeChild(card)
                saveChanges()
                // console.log("delete")
            }
            if (e.target.matches(".edit-btn")) {
                let card = e.target.closest(".card")
                let h3 = card.querySelector("h3")
                let p = card.querySelector("p")
                titleInput.value = h3.textContent
                contentInput.value = card.dataset.rawContent || card.querySelector("p").textContent;
                notesContainer.removeChild(card)
                saveChanges()
            }
        })
        loadCards()
    </script>
</body>

</html>
